# Builds CapCraft for 32-bit ARM phones (armeabi-v7a, e.g. Redmi A3) and keeps the APK as the run's
# artifact. Run it by hand: Actions › Build ARMv7 › Run workflow. It releases nothing.
#
# Without the release key's secrets the APK is signed with the debug key, which is fine for installing
# on your own phone. Set "FFmpeg without ARM assembly" to true if the FFmpeg or link step fails with
# text-relocation errors (slower video, but it builds on more toolchains).
#
# Same recipe as release.yml, with the 32-bit target: FFmpeg built from source by
# src/scripts/ffmpeg-mobile.sh, the sherpa-onnx runtime fetched by src/scripts/sherpa-mobile.sh, and
# src/scripts/mobile-env.sh naming both for the build.
name: Build ARMv7

on:
  workflow_dispatch:
    inputs:
      ffmpeg_no_asm:
        description: 'FFmpeg without ARM assembly (fallback if the build fails on relocations)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: build-armv7-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # ggml (whisper.cpp) compiles to the portable baseline for the architecture rather than to
  # whatever the build machine has
  GGML_NATIVE: "OFF"
  NDK_VERSION: 29.0.14206865
  TARGET: armv7-linux-androideabi
  ABI: armeabi-v7a

jobs:
  apk:
    name: APK (armeabi-v7a)
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: System libraries
        run: sudo apt-get update && sudo apt-get install -y cmake libclang-dev

      # the Rust release src/rust-toolchain.toml names, with the phone's standard library
      - name: Install Rust
        working-directory: src
        run: |
          rustup toolchain install
          rustup target add "$TARGET"

      - name: Install cargo-ndk and the Android NDK
        run: |
          cargo install cargo-ndk --version 4.1.2 --locked
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK_VERSION" >/dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >>"$GITHUB_ENV"

      - name: FFmpeg settings
        run: echo "FFMPEG_ARM_ASM=${{ inputs.ffmpeg_no_asm && '0' || '1' }}" >>"$GITHUB_ENV"

      # restored and saved as two steps, so the FFmpeg build is kept the moment it finishes,
      # whatever happens to the Rust build after it
      - name: FFmpeg for Android (cached)
        id: ffmpeg
        uses: actions/cache/restore@v5
        with:
          path: src/vendor/ffmpeg/armv7-linux-androideabi
          key: ffmpeg-armv7-linux-androideabi-${{ env.NDK_VERSION }}-asm${{ env.FFMPEG_ARM_ASM }}-${{ hashFiles('src/scripts/ffmpeg-mobile.sh') }}
      - name: FFmpeg for Android
        if: steps.ffmpeg.outputs.cache-hit != 'true'
        run: src/scripts/ffmpeg-mobile.sh armv7-linux-androideabi
      - name: FFmpeg for Android (save)
        if: steps.ffmpeg.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: src/vendor/ffmpeg/armv7-linux-androideabi
          key: ${{ steps.ffmpeg.outputs.cache-primary-key }}

      - name: sherpa-onnx for Android
        run: src/scripts/sherpa-mobile.sh armv7-linux-androideabi

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src
          key: build-armv7

      - name: Release key
        env:
          KEYSTORE_BASE64: ${{ secrets.CAPCRAFT_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 -d >"$RUNNER_TEMP/release.p12"
            echo "CAPCRAFT_KEYSTORE=$RUNNER_TEMP/release.p12" >>"$GITHUB_ENV"
          else
            echo "::warning::No release key: this APK is signed with the debug key"
          fi

      - name: Build
        env:
          CAPCRAFT_KEYSTORE_PASSWORD: ${{ secrets.CAPCRAFT_KEYSTORE_PASSWORD }}
          CAPCRAFT_KEY_ALIAS: ${{ secrets.CAPCRAFT_KEY_ALIAS }}
          CAPCRAFT_KEY_PASSWORD: ${{ secrets.CAPCRAFT_KEY_PASSWORD }}
        run: |
          cd src
          eval "$(scripts/mobile-env.sh armv7-linux-androideabi)"
          cd crates/capcraft-android/android
          ./gradlew assembleRelease "-Pcapcraft.abis=armeabi-v7a" --no-daemon
          mkdir -p "$GITHUB_WORKSPACE/dist"
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/dist/capcraft-android-armv7.apk"

      - name: APK
        run: |
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -n 1)apksigner"
          "$apksigner" verify --print-certs dist/capcraft-android-armv7.apk | grep "certificate SHA-256" | tee -a "$GITHUB_STEP_SUMMARY"
          # the native libraries the phone will load must be 32-bit
          unzip -l dist/capcraft-android-armv7.apk | grep -E "lib/" | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: capcraft-android-armv7
          path: dist/*
          if-no-files-found: error

      - name: Remove the release key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.p12"
